name: Release Precompiled NIF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example: v1.2.3)"
        required: true
        type: string
      publish_hex:
        description: "Publish to Hex.pm after creating/updating the release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  MIX_ENV: prod
  MIX_TARGET: nerves_system_sg2002
  ELIXIR_MAKE_CACHE_DIR: cache
  SG200X_FHS: "1"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v ]]; then
            echo "Expected a v* tag, got '${tag}'"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_tag.outputs.tag }}
          submodules: recursive

      - name: Set up BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.18.4"

      - name: Install system build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            make \
            pkg-config \
            ninja-build \
            python3 \
            curl \
            git \
            unzip \
            wget \
            file \
            ca-certificates

      - name: Restore Mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            cache
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Install SG2002 SDK and host-tools
        shell: bash
        run: |
          set -euo pipefail

          RECAMERA_ROOT="$GITHUB_WORKSPACE/.devenv/state/sg200x-sdk"
          SDK_DIR="$RECAMERA_ROOT/sg2002_recamera_emmc"
          SDK_TARBALL="$RECAMERA_ROOT/reCameraOS_sdk_v0.2.0.tar.gz"
          HOST_TOOLS_DIR="$RECAMERA_ROOT/host-tools"

          mkdir -p "$RECAMERA_ROOT"

          if [ ! -d "$SDK_DIR" ]; then
            if [ ! -f "$SDK_TARBALL" ]; then
              wget -O "$SDK_TARBALL" \
                "https://github.com/Seeed-Studio/reCamera-OS/releases/download/0.2.0/reCameraOS_sdk_v0.2.0.tar.gz"
            fi
            tar -xzf "$SDK_TARBALL" -C "$RECAMERA_ROOT" --strip-components=0
          fi

          while IFS= read -r broken_link; do
            rm -f "$broken_link"
          done < <(find "$RECAMERA_ROOT" -type l ! -exec test -e {} \; -print)

          if [ ! -d "$HOST_TOOLS_DIR/.git" ]; then
            rm -rf "$HOST_TOOLS_DIR"
            git clone --depth 1 https://github.com/sophgo/host-tools.git "$HOST_TOOLS_DIR"
          fi

          COMPILER_DIR="$HOST_TOOLS_DIR/gcc/riscv64-linux-musl-x86_64/bin"

          for tool in gcc g++ objcopy objdump ar as ld nm ranlib strip; do
            if [ -f "$COMPILER_DIR/riscv64-linux-musl-$tool" ] && [ ! -f "$COMPILER_DIR/riscv64-unknown-linux-musl-$tool" ]; then
              ln -sf "riscv64-linux-musl-$tool" "$COMPILER_DIR/riscv64-unknown-linux-musl-$tool"
            fi
          done

          {
            echo "SG200X_SDK_PATH=$SDK_DIR"
            echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-riscv64-linux-musl-x86_64.cmake"
          } >> "$GITHUB_ENV"

          echo "$COMPILER_DIR" >> "$GITHUB_PATH"

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euo pipefail

          command -v riscv64-unknown-linux-musl-gcc
          command -v riscv64-unknown-linux-musl-g++
          file "$(command -v riscv64-unknown-linux-musl-gcc)"
          riscv64-unknown-linux-musl-gcc --version
          riscv64-unknown-linux-musl-g++ --version
          printf 'int main(void){return 0;}\n' | riscv64-unknown-linux-musl-gcc -x c - -c -o /tmp/sscmex_toolchain_smoke.o

      - name: Fetch dependencies
        run: MIX_ENV=prod mix deps.get

      - name: Verify tag matches mix version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          version="$(
            MIX_ENV=prod mix run --no-start --no-compile -e "IO.puts(\"SSCMEX_VERSION=\" <> to_string(Mix.Project.config()[:version]))" \
            | tr -d '\r' | sed -n 's/^SSCMEX_VERSION=//p' | tail -n1
          )"

          if [ -z "${version}" ]; then
            echo "Unable to extract Mix project version"
            exit 1
          fi

          expected_tag="v${version}"

          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag/version mismatch: expected '${expected_tag}', got '${RELEASE_TAG}'"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "github.ref_name mismatch: expected '${expected_tag}', got '${GITHUB_REF_NAME}'"
            exit 1
          fi

      - name: Build precompiled tarball
        env:
          TARGET_ARCH: riscv64
          TARGET_OS: buildroot
          TARGET_ABI: linux-musl
        run: MIX_ENV=prod mix elixir_make.precompile

      - name: Verify precompiled tarball asset
        shell: bash
        run: |
          ls -lh cache/*.tar.gz
          ls -lh cache/*.tar.gz.sha256

      - name: Publish precompiled tarball assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            cache/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Build checksum.exs from published release assets
        env:
          TARGET_ARCH: riscv64
          TARGET_OS: buildroot
          TARGET_ABI: linux-musl
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable

            if python - <<'PY'
          from pathlib import Path

          checksum = Path("checksum.exs").read_text(encoding="utf-8")
          raise SystemExit(0 if "sscmex-nif-" in checksum and "sha256:" in checksum else 1)
          PY
            then
              echo "Generated checksum.exs with precompiled entries."
              exit 0
            fi

            echo "checksum.exs not ready yet (attempt ${attempt}/10), retrying in 5 seconds..."
            sleep 5
          done

          echo "Failed to generate checksum.exs with precompiled entries."
          exit 1

      - name: Verify checksum.exs has precompiled entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checksum = Path("checksum.exs").read_text(encoding="utf-8")
          if "sscmex-nif-" not in checksum or "sha256:" not in checksum:
              raise SystemExit("checksum.exs does not contain precompiled NIF entries")
          PY

      - name: Publish checksum asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: checksum.exs
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish to Hex.pm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        shell: bash
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "HEX_API_KEY secret is required when publish_hex=true"
            exit 1
          fi

          MIX_ENV=prod mix hex.publish --yes
