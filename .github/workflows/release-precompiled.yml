name: Release Precompiled NIF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (for example: v1.2.3)"
        required: true
        type: string
      publish_hex:
        description: "Publish to Hex.pm after creating/updating the release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  MIX_ENV: prod
  ELIXIR_MAKE_CACHE_DIR: cache

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${tag}" =~ ^v ]]; then
            echo "Expected a v* tag, got '${tag}'"
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.release_tag.outputs.tag }}
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-25.05

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - name: Restore nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Restore Mix cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            cache
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: devenv shell -- bash -lc "MIX_ENV=prod mix deps.get"

      - name: Verify tag matches mix version
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          version="$(devenv shell -- bash -lc 'MIX_ENV=prod mix run --no-compile -e "IO.write(Mix.Project.config()[:version])"')"
          expected_tag="v${version}"

          if [ "${RELEASE_TAG}" != "${expected_tag}" ]; then
            echo "Tag/version mismatch: expected '${expected_tag}', got '${RELEASE_TAG}'"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "github.ref_name mismatch: expected '${expected_tag}', got '${GITHUB_REF_NAME}'"
            exit 1
          fi

      - name: Build precompiled tarball
        env:
          TARGET_ARCH: riscv64
          TARGET_OS: buildroot
          TARGET_ABI: linux-musl
        run: devenv shell -- bash -lc "MIX_ENV=prod mix elixir_make.precompile"

      - name: Verify precompiled tarball asset
        shell: bash
        run: |
          ls -lh cache/*.tar.gz
          ls -lh cache/*.tar.gz.sha256

      - name: Publish precompiled tarball assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: |
            cache/*.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Build checksum.exs from published release assets
        env:
          TARGET_ARCH: riscv64
          TARGET_OS: buildroot
          TARGET_ABI: linux-musl
        shell: bash
        run: |
          for attempt in $(seq 1 10); do
            devenv shell -- bash -lc "MIX_ENV=prod mix elixir_make.checksum --all --ignore-unavailable"

            if python - <<'PY'
          from pathlib import Path

          checksum = Path("checksum.exs").read_text(encoding="utf-8")
          raise SystemExit(0 if "sscmex-nif-" in checksum and "sha256:" in checksum else 1)
          PY
            then
              echo "Generated checksum.exs with precompiled entries."
              exit 0
            fi

            echo "checksum.exs not ready yet (attempt ${attempt}/10), retrying in 5 seconds..."
            sleep 5
          done

          echo "Failed to generate checksum.exs with precompiled entries."
          exit 1

      - name: Verify checksum.exs has precompiled entries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checksum = Path("checksum.exs").read_text(encoding="utf-8")
          if "sscmex-nif-" not in checksum or "sha256:" not in checksum:
              raise SystemExit("checksum.exs does not contain precompiled NIF entries")
          PY

      - name: Publish checksum asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          files: checksum.exs
          fail_on_unmatched_files: true
          overwrite_files: true

      - name: Publish to Hex.pm
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hex }}
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        shell: bash
        run: |
          if [ -z "${HEX_API_KEY}" ]; then
            echo "HEX_API_KEY secret is required when publish_hex=true"
            exit 1
          fi

          devenv shell -- bash -lc "MIX_ENV=prod mix hex.publish --yes"
