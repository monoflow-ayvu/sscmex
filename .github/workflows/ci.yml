name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  MIX_ENV: prod
  MIX_TARGET: nerves_system_sg2002
  ELIXIR_MAKE_CACHE_DIR: cache
  SG200X_FHS: "1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.3"
          elixir-version: "1.18.4"

      - name: Install system build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            make \
            pkg-config \
            ninja-build \
            python3 \
            curl \
            git \
            unzip \
            wget \
            file \
            ca-certificates

      - name: Restore Mix cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install Hex and Rebar
        shell: bash
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Restore SG2002 SDK cache
        uses: actions/cache@v6
        with:
          path: .devenv/state/sg200x-sdk
          key: ${{ runner.os }}-sg200x-sdk-reCameraOS-0.2.0

      - name: Install SG2002 SDK and host-tools
        shell: bash
        run: |
          set -euo pipefail

          RECAMERA_ROOT="$GITHUB_WORKSPACE/.devenv/state/sg200x-sdk"
          SDK_DIR="$RECAMERA_ROOT/sg2002_recamera_emmc"
          SDK_TARBALL="$RECAMERA_ROOT/reCameraOS_sdk_v0.2.0.tar.gz"
          HOST_TOOLS_DIR="$RECAMERA_ROOT/host-tools"

          mkdir -p "$RECAMERA_ROOT"

          if [ ! -d "$SDK_DIR" ]; then
            if [ ! -f "$SDK_TARBALL" ]; then
              wget -O "$SDK_TARBALL" \
                "https://github.com/Seeed-Studio/reCamera-OS/releases/download/0.2.0/reCameraOS_sdk_v0.2.0.tar.gz"
            fi
            tar -xzf "$SDK_TARBALL" -C "$RECAMERA_ROOT" --strip-components=0
          fi

          while IFS= read -r broken_link; do
            rm -f "$broken_link"
          done < <(find "$RECAMERA_ROOT" -type l ! -exec test -e {} \; -print)

          if [ ! -d "$HOST_TOOLS_DIR/.git" ]; then
            rm -rf "$HOST_TOOLS_DIR"
            git clone --depth 1 https://github.com/sophgo/host-tools.git "$HOST_TOOLS_DIR"
          fi

          COMPILER_DIR="$HOST_TOOLS_DIR/gcc/riscv64-linux-musl-x86_64/bin"

          for tool in gcc g++ objcopy objdump ar as ld nm ranlib strip; do
            if [ -f "$COMPILER_DIR/riscv64-linux-musl-$tool" ] && [ ! -f "$COMPILER_DIR/riscv64-unknown-linux-musl-$tool" ]; then
              ln -sf "riscv64-linux-musl-$tool" "$COMPILER_DIR/riscv64-unknown-linux-musl-$tool"
            fi
          done

          {
            echo "SG200X_SDK_PATH=$SDK_DIR"
            echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/toolchain-riscv64-linux-musl-x86_64.cmake"
          } >> "$GITHUB_ENV"

          echo "$COMPILER_DIR" >> "$GITHUB_PATH"

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euo pipefail

          command -v riscv64-unknown-linux-musl-gcc
          command -v riscv64-unknown-linux-musl-g++
          file "$(command -v riscv64-unknown-linux-musl-gcc)"
          riscv64-unknown-linux-musl-gcc --version
          riscv64-unknown-linux-musl-g++ --version
          printf 'int main(void){return 0;}\n' | riscv64-unknown-linux-musl-gcc -x c - -c -o /tmp/sscmex_toolchain_smoke.o

      - name: Fetch dependencies
        run: MIX_ENV=prod mix deps.get

      - name: Compile Elixir
        run: MIX_ENV=prod mix compile

      - name: Build precompiled NIF (riscv64)
        env:
          TARGET_ARCH: riscv64
          TARGET_OS: linux
          TARGET_ABI: musl
        run: MIX_ENV=prod mix elixir_make.precompile

      - name: Verify consumer build restores precompiled NIF
        shell: bash
        env:
          ELIXIR_MAKE_CACHE_DIR: ${{ github.workspace }}/cache
        run: |
          set -euo pipefail

          version="$(
            MIX_ENV=prod mix run --no-start --no-compile -e "IO.puts(\"SSCMEX_VERSION=\" <> to_string(Mix.Project.config()[:version]))" \
            | tr -d '\r' | sed -n 's/^SSCMEX_VERSION=//p' | tail -n1
          )"

          if [ -z "${version}" ]; then
            echo "Unable to resolve SSCMEx version"
            exit 1
          fi

          shopt -s nullglob
          tarballs=(cache/sscmex-nif-*-${version}.tar.gz)
          if [ "${#tarballs[@]}" -eq 0 ]; then
            echo "Expected precompiled tarball not found: cache/sscmex-nif-*-${version}.tar.gz"
            exit 1
          fi
          if [ "${#tarballs[@]}" -gt 1 ]; then
            tarball=""
            for f in "${tarballs[@]}"; do
              if [[ "$f" == *"riscv64-linux-musl"* ]]; then
                tarball="$f"
                break
              fi
            done
            if [ -z "${tarball}" ]; then
              for f in "${tarballs[@]}"; do
                if [[ "$f" == *"riscv64-linux-linux-musl"* ]]; then
                  tarball="$f"
                  break
                fi
              done
            fi
            if [ -z "${tarball}" ]; then
              for f in "${tarballs[@]}"; do
                if [[ "$f" == *"riscv64gc-unknown-linux-musl"* ]]; then
                  tarball="$f"
                  break
                fi
              done
            fi
            if [ -z "${tarball}" ]; then
              for f in "${tarballs[@]}"; do
                if [[ "$f" == *"riscv64-unknown-linux-musl"* ]]; then
                  tarball="$f"
                  break
                fi
              done
            fi
            if [ -z "${tarball}" ]; then
              tarball="${tarballs[0]}"
            fi
          else
            tarball="${tarballs[0]}"
          fi

          if [ ! -f "${tarball}" ]; then
            echo "Expected precompiled tarball not found: ${tarball}"
            exit 1
          fi

          digest="$(sha256sum "${tarball}" | awk '{print $1}')"
          cat > checksum.exs <<EOF
          %{
            "$(basename "${tarball}")" => "sha256:${digest}",
          }
          EOF

          consumer_dir="$(mktemp -d)"

          cat > "${consumer_dir}/mix.exs" <<EOF
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [
                app: :consumer,
                version: "0.1.0",
                elixir: "~> 1.17",
                deps: deps()
              ]
            end

            def application, do: [extra_applications: [:logger]]
            defp deps, do: [{:sscmex, path: "${GITHUB_WORKSPACE}"}]
          end
          EOF

          mkdir -p "${consumer_dir}/lib"
          cat > "${consumer_dir}/lib/consumer.ex" <<'EOF'
          defmodule Consumer do
          end
          EOF

          (
            cd "${consumer_dir}"
            export TARGET_ARCH="riscv64"
            export TARGET_OS="nerves"
            export TARGET_ABI="musl"
            MIX_ENV=prod MIX_TARGET=nerves_system_sg2002 mix deps.get
            MIX_ENV=prod MIX_TARGET=nerves_system_sg2002 mix deps.compile elixir_make cc_precompiler
            MAKE=false MIX_ENV=prod MIX_TARGET=nerves_system_sg2002 mix deps.compile sscmex --force
          )

          consumer_build_dir="${consumer_dir}/_build/nerves_system_sg2002_prod"
          test -f "${consumer_build_dir}/lib/sscmex/priv/sscmex_nif.so"

      - name: Verify build artifacts
        shell: bash
        run: |
          ls -la cache/
          ls -lh cache/*.tar.gz
